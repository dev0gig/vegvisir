<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEDC5"/>
      <stop offset="1" stop-color="#F5C84C"/>
    </linearGradient>
  </defs>

  <!-- Maskable-Variante fürs Android-Homescreen-Icon: gleicher Aufbau wie
       favicon.svg, aber der Kompass ist auf das gemeinsame Symbol-Normmaß der
       nativen Apps verkleinert (~41,7% der Kachel statt 55%, vgl. Origami/
       Dices/Newspaper/BookUp). Hintergrund bleibt randlos (full bleed), damit
       Android/Samsung die eigene Maske (Kreis/Squircle) anwenden kann. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cast Shadow: gleiche Form, hart versetzt (Flat Style wie favicon.svg),
       Versatz proportional mitverkleinert (18px → 13.5px) -->
  <g fill="none" stroke="#1A1A1A" stroke-opacity="0.22" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     transform="translate(161.5,161.5) scale(9)">
    <circle cx="12" cy="12" r="10"/>
    <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
  </g>

  <!-- Kompass in Ink, zentriert (256,256), 24er-ViewBox auf 216px skaliert -->
  <g fill="none" stroke="#1A1A1A" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     transform="translate(148,148) scale(9)">
    <circle cx="12" cy="12" r="10"/>
    <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>
  </g>
</svg>
