<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vegvisir — Find your way.</title>
<meta name="description" content="Eine persönliche Bookmark-Sammlung. Find your way." />
<meta name="theme-color" content="#D4A373" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="./assets/favicon.png" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <input id="importFile" type="file" accept=".json,application/json" hidden />

  <div class="wrap">
    <main class="home" id="home">
      <div id="homeNote"></div>
      <div id="homeGrid"></div>
    </main>
  </div>

  <!-- Abgedunkelter Hintergrund — gehört nur den Werkzeug-Sheets. -->
  <div class="sheet-backdrop" id="backdrop"></div>

  <div class="drop-veil" id="dropVeil">
    <div class="drop-card">
      <i data-lucide="file-down" class="drop-ico"></i>
      <p class="drop-title">Datei hier ablegen</p>
      <p class="drop-sub">JSON → Bookmarks</p>
    </div>
  </div>

  <!-- Feste Leiste unten: Suche + Menü-Knopf teilen sich die Breite -->
  <div class="bottombar" id="bottombar">
    <div class="searchbar hidden" id="searchbar">
      <i data-lucide="search" class="search-ico"></i>
      <input id="searchInput" type="search" placeholder="Suchen…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="search-clear" id="searchClear" aria-label="Suche beenden"><i data-lucide="x"></i></button>
    </div>
    <!-- Ein einziger Menü-Knopf: Bookmark-Verwaltung + Werkzeuge (tools.js).
         Aufgebaut in toolwindows.js. -->
    <div class="tools-dock" id="toolsDock"></div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="./tools.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
