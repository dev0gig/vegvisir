<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vegvisir — Find your way.</title>
<meta name="description" content="Eine persönliche Bookmark-Sammlung. Find your way." />
<meta name="theme-color" content="#060a14" />

<!-- PWA: installierbar ohne Service Worker (nur Manifest + Icons) -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vegvisir" />

<!-- Favicon (einziges Icon, abgerundete Ecken transparent) -->
<link rel="icon" type="image/png" href="./assets/favicon.png" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <input id="importFile" type="file" accept=".json,application/json" hidden />

  <!-- Login-Gate: liegt über allem, bis eine erlaubte Anmeldung besteht. -->
  <div class="auth-gate" id="authGate">
    <div class="auth-card">
      <i data-lucide="compass" class="auth-ico"></i>
      <h1 class="auth-title">Vegvisir</h1>
      <p class="auth-sub">Find your way.</p>
      <button class="btn-import auth-login" id="loginGithub">
        <!-- GitHub-Logo als Inline-SVG (Lucide führt keine Marken-Icons mehr). -->
        <svg class="gh-ico" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Mit GitHub anmelden
      </button>
      <p class="auth-msg" id="authMsg" role="alert"></p>
    </div>
  </div>

  <div class="wrap">
    <main class="home" id="home">
      <div id="homeFav"></div>
      <div id="homeGrid"></div>
    </main>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div id="sheets"></div>
  <div class="drop-veil">JSON hier ablegen</div>

  <!-- Feste Leiste unten: Suche + Werkzeug-Knöpfe teilen sich die Breite -->
  <div class="bottombar" id="bottombar">
    <div class="searchbar hidden" id="searchbar">
      <i data-lucide="search" class="search-ico"></i>
      <input id="searchInput" type="search" placeholder="Suchen…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="search-clear" id="searchClear" aria-label="Suche beenden"><i data-lucide="x"></i></button>
    </div>
    <!-- Ein einziger Menü-Knopf: öffnet ein kleines Menü mit allen Werkzeugen
         (aus tools.js) und dem Abmelden-Eintrag. Aufgebaut in toolwindows.js. -->
    <div class="tools-dock" id="toolsDock"></div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./tools.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
