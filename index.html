<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vegvisir — Find your way.</title>
<meta name="description" content="Persönliche Startseite: Favoriten und Werkzeuge. Find your way." />
<meta name="theme-color" content="#1B1815" />

<!-- Favicon + Install-Icon (Chrome „Seite installieren" nutzt das Manifest
     nur noch für Name und Icon — einen Service Worker gibt es nicht mehr). -->
<link rel="icon" type="image/png" href="./assets/favicon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <main class="home" id="home">
      <div id="homeGrid"></div>
    </main>
  </div>

  <!-- Feste Leiste unten: nur die Suche. Alles andere (anlegen, Werkzeuge)
       läuft über die Slash-Befehle bzw. die Kacheln. -->
  <div class="bottombar" id="bottombar">
    <div class="searchbar" id="searchbar">
      <i data-lucide="search" class="search-ico"></i>
      <input id="searchInput" type="search" placeholder="Suchen…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button class="search-clear" id="searchClear" aria-label="Suche beenden"><i data-lucide="x"></i></button>
    </div>
  </div>

  <!-- Lucide liegt lokal im Repo, damit kein fremder Server gebraucht wird. -->
  <script src="./js/vendor/lucide.min.js"></script>
  <script src="./tools.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
